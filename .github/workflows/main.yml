
      - name: Diagnose project structure
        shell: bash
        run: |
          echo "===== REPOSITORY ROOT ====="
          pwd
          ls -la

          echo "===== PROJECT FILES ====="
          find . -maxdepth 7 -type f \
            -not -path './.git/*' \
            | sort

          echo "===== REQUIRED FILE CHECK ====="

          for file in \
            settings.gradle \
            build.gradle \
            app/build.gradle \
            app/src/main/AndroidManifest.xml
          do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
            fi
          done
